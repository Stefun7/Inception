# Treat the way NGINX treat connexions
events {
	# Max connexions by processus
	worker_connections 1024;
}

# main configuration of the server
http {
	include /etc/nginx/mime.types;

	default_type application/octet-stream;

	# virtual host configuration (WP)
	server {
		listen 443 ssl http2;

		# Domain name
		server_name scesar.42.fr www.scesar.42.fr;

		ssl_certificate /etc/nginx/ssl/nginx.crt;
		ssl_certificate_key /etc/nginx/ssl/nginx.key;

		# SSL/TLS Protocols
		ssl_protocols TLSv1.2 TLSv1.3;

		# root WP files
		root /var/www/html;

		# first files to deliver
		index index.php index.html index.htm;

		# defalut request
		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		# files treatment
		location ~ \.php$ {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;

			# redirect request to 9000
			fastcgi_pass wordpress:9000;

			# default php file
			fastcgi_index index.php;

			# default Fastcgi
			include fastcgi_params;

			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

			fastcgi_param PATH_INFO $fastcgi_path_info;
		}

		location ~ /\.ht {
			deny all;
		}
	}
}